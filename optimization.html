<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>团队配装优化</title>
    <link rel="icon" href="data:," />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/i18next/21.6.10/i18next.min.js" integrity="sha512-4WlJJ18bTOvB8ask0iufUvS/N3NDs2NJUKXGeK9CGoFayxUASLGsiBAvMtO+dfdp+MNzaOZLStxIwc2rZz5hSg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/i18next-browser-languagedetector/6.1.3/i18nextBrowserLanguageDetector.min.js" integrity="sha512-w/1n/omCK6/QXznOMYrp+arhVcWM87ioNqNkpWyFYhDFBgLNiwUG9Omp/YGPwy5Q/p7lktUI1eXZX3nN/TDDAA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/i18next-http-backend/1.3.2/i18nextHttpBackend.min.js" integrity="sha512-6KSl9S4uqyiqhlImZ5pcEQKCU7Mk/nyr+nJQAZe9ZY9en6cUmQKG/b3v1Db/1fOiV5zdOjjwWQ/S90p7eDLxgA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/i18n.js"></script>
    <style>
        /* Same palette as skill-lab.html and group-battle.html so the tools read as one set. */
        :root {
            --bg: #1e1f24;
            --panel: #2a2c33;
            --panel2: #33353d;
            --text: #e8e8ea;
            --dim: #9aa0aa;
            --accent: #5b9bd5;
            --border: #3d404a;
            --good: #4caf50;
            --bad: #e05252;
            --warn: #d4a13a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }

        header {
            padding: 14px 20px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            gap: 14px;
            flex-wrap: wrap;
        }

        header h1 { font-size: 18px; margin: 0; }
        header .dim { color: var(--dim); }
        header nav { margin-left: auto; display: flex; gap: 12px; }
        header nav a { color: var(--accent); text-decoration: none; }
        header nav a:hover { text-decoration: underline; }

        main { padding: 16px 20px 60px; display: flex; flex-direction: column; gap: 16px; }

        section {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
        }

        section > h2 {
            font-size: 14px;
            margin: 0 0 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--dim);
        }

        .grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }

        .tiers { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); }

        label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            color: var(--dim);
        }

        label.inline { flex-direction: row; align-items: center; gap: 6px; }

        select, input[type="number"] {
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 13px;
            min-width: 120px;
        }

        input[type="number"] { min-width: 80px; }

        .btn {
            background: var(--accent);
            color: #10131a;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn.small { padding: 4px 8px; font-size: 12px; }
        .btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
        .btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--border); }

        /* js/i18n.js adds its own fixed switcher; this page has one in the header instead. */
        .language-switcher { display: none !important; }

        #langToggle { display: flex; gap: 4px; }
        #langToggle button {
            background: var(--panel2);
            color: var(--dim);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        #langToggle button.active { background: var(--accent); color: #10131a; border-color: var(--accent); font-weight: 600; }

        .status { font-size: 12px; color: var(--dim); }
        .status.warn { color: var(--warn); }
        .hidden { display: none !important; }
        .hint { font-size: 11px; color: var(--dim); margin-top: 4px; }
        .hint.warn { color: var(--warn); }
        .dim { color: var(--dim); }

        #playerSlots { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }

        .card {
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card h3 { font-size: 13px; margin: 0; }
        .card select { width: 100%; }

        .kit {
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 6px 0;
            font-size: 12px;
        }

        .kit-row { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }

        .candidates { display: flex; flex-direction: column; gap: 10px; }

        .candidate-kit {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(0, 0, 0, 0.12);
        }

        .candidate-head { display: flex; gap: 6px; align-items: center; }
        .candidate-head input { flex: 1; min-width: 0; }
        .candidate-head .kit-name { flex: 1; min-width: 0; font-weight: 600; }

        .kit-actions { display: flex; gap: 6px; }

        .candidate-row { display: flex; gap: 6px; align-items: center; }
        .candidate-row > span { width: 48px; flex: none; font-size: 11px; }
        .candidate-row select { min-width: 0; flex: 1; }
        .candidate-row input { width: 60px; min-width: 0; flex: none; }

        input[type="text"] {
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
        }

        .progress {
            height: 6px;
            background: var(--panel2);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        #progressFill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
        #progressText { font-size: 12px; color: var(--dim); margin-top: 6px; }

        #previewModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
        }

        .modal-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: min(560px, 100%);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-head h3 { margin: 0; font-size: 14px; }
        .modal-body { overflow-y: auto; padding: 12px 16px 18px; }

        .preview-section { margin-top: 12px; }
        .preview-section:first-child { margin-top: 0; }
        .preview-section h4 {
            margin: 0 0 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
        }

        .preview-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 12px;
            padding: 1px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .table-wrap { overflow-x: auto; }

        table { border-collapse: collapse; width: 100%; font-size: 12px; white-space: nowrap; }

        th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--border); }
        th:first-child, td:first-child, .variant { text-align: left; }
        thead th { color: var(--dim); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
        thead tr.group th { border-bottom: none; color: var(--accent); }
        /* Long ranger kit names wrap rather than cut off the DPS that follows them. */
        td.variant { max-width: 320px; white-space: normal; }
        .weapon-icon { width: 20px; height: 20px; vertical-align: middle; margin-right: 5px; }
        .kit-cell { display: inline-flex; align-items: center; gap: 8px; }
        .kit-weapon { display: inline-flex; padding-right: 8px; border-right: 1px solid var(--border); }
        .kit-weapon .weapon-icon { width: 24px; height: 24px; margin: 0; }
        .kit-abilities { display: inline-flex; flex-wrap: wrap; gap: 2px; }
        .kit-dps { color: var(--dim); font-size: 11px; white-space: nowrap; padding-left: 8px; border-left: 1px solid var(--border); }
        .ability-icon { width: 24px; height: 24px; background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 1px; }
        .ability-text { font-size: 11px; padding: 0 3px; border: 1px solid var(--border); border-radius: 4px; }
        /* The aura leads the kit, set off by a gold border and a little extra space. */
        .ability-icon.aura, .ability-text.aura { border-color: var(--warn); margin-right: 4px; }
        tr.expandable { cursor: pointer; }
        tr.expandable:hover td { background: rgba(255, 255, 255, 0.03); }
        td.row-head { white-space: nowrap; width: 1%; }
        td.row-end { text-align: right; white-space: nowrap; }
        .chevron { display: inline-block; width: 14px; color: var(--dim); }
        /* A zone's 2nd and 3rd best: same columns as its lead row, indented under it. */
        tr.runner-up td { background: rgba(0, 0, 0, 0.15); }
        td.indent { padding-left: 22px; color: var(--dim); }
        .rank { display: inline-block; min-width: 22px; color: var(--dim); font-weight: 600; }
        .diff { font-size: 11px; color: var(--dim); }
        .diff.up { color: var(--good); }
        .diff.down { color: var(--bad); }
        th.sep, td.sep { border-left: 2px solid var(--accent); }
        td.strong { font-weight: 700; }
        td.warnCell { color: var(--warn); }
        tr.baseline td { background: rgba(91, 155, 213, 0.08); }
        tr.best td { background: rgba(76, 175, 80, 0.12); }
        tr.failed td { color: var(--bad); }

        #zonePanel { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
        .zone-card {
            background: var(--panel2);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: opacity .15s;
        }
        .zone-card.off { opacity: 0.4; border-left-color: var(--border); filter: grayscale(1); }
        .zone-card.off:hover { opacity: 0.7; }
        .zone-head { flex-direction: row; align-items: center; gap: 6px; color: var(--text); cursor: pointer; }
        .zone-name { font-size: 13px; font-weight: 600; }
        .zone-item { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .zone-tiers { display: flex; gap: 4px; }
        .tier-chip {
            flex: 1;
            flex-direction: row;
            justify-content: center;
            padding: 3px 0;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 12px;
            color: var(--dim);
            cursor: pointer;
            user-select: none;
        }
        .tier-chip input { display: none; }
        .tier-chip:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #10131a; font-weight: 600; }
    </style>
</head>

<body>
    <header>
        <h1 data-i18n-opt="pageTitle">团队配装优化</h1>
        <span class="dim" data-i18n-opt="pageSubtitle">三人碎片刷取方案扫描</span>
        <nav>
            <a href="index.html" data-i18n-opt="navSimulator">模拟器</a>
            <a href="group-battle.html" data-i18n-opt="navGroupBattle">团战</a>
            <a href="skill-lab.html" data-i18n-opt="navSkillLab">技能实验室</a>
            <span id="langToggle">
                <button type="button" data-lang="zh">中文</button>
                <button type="button" data-lang="en">EN</button>
            </span>
        </nav>
    </header>

    <main>
        <section>
            <h2 data-i18n-opt="secTarget">模拟设置</h2>
            <div class="grid">
                <label><span data-i18n-opt="labelGoal">优化目标</span>
                    <select id="goalSelect">
                        <option value="fragments" data-i18n-opt="goalFragments">每小时碎片数</option>
                        <option value="xp" data-i18n-opt="goalXp">每小时经验</option>
                        <option value="charms" data-i18n-opt="goalCharms">每小时护符</option>
                    </select>
                </label>
                <label><span data-i18n-opt="labelFastHours">快速模拟时长（小时）</span>
                    <input type="number" id="fastHours" value="24" min="1" max="2500" data-i18n-opt-title="fastHoursTitle">
                </label>
                <label><span data-i18n-opt="labelFullHours">完整模拟时长（小时）</span>
                    <input type="number" id="fullHours" value="200" min="1" max="2500" data-i18n-opt-title="fullHoursTitle">
                </label>
            </div>
            <div class="grid" style="margin-top:12px">
                <label class="inline"><input type="checkbox" id="mooPass"> <span data-i18n-opt="labelMooPass">哞卡</span></label>
                <label><span data-i18n-opt="labelComExp">社区经验 buff</span>
                    <input type="number" id="comExp" value="0" min="0" max="100">
                </label>
                <label><span data-i18n-opt="labelComDrop">社区掉落 buff</span>
                    <input type="number" id="comDrop" value="0" min="0" max="100">
                </label>
            </div>
            <div class="hint" data-i18n-opt="evHint">碎片数量按击杀数和掉落率算期望值，不掷随机掉落，所以同一套配装两次运行的结果可以直接比较。</div>
        </section>

        <section>
            <h2 data-i18n-opt="secZones">地区设置</h2>
            <div class="grid" style="margin-bottom:10px">
                <button type="button" class="btn small ghost" id="zonesDefault" data-i18n-opt="zonesDefault">全部 T4+T5</button>
                <button type="button" class="btn small ghost" id="zonesClear" data-i18n-opt="zonesClear">全部关闭</button>
                <span class="hint" data-i18n-opt="zonesHint">两种模拟都用这里的难度。“模拟全部地区”扫描所有开启的地区；关闭的地区（灰色）跳过，也不出现在单个地区的列表里，难度设置会保留。</span>
            </div>
            <div id="zonePanel"></div>
        </section>

        <section>
            <h2 data-i18n-opt="secGroup">队伍</h2>
            <div class="grid" style="margin-bottom:12px">
                <span class="status" id="pluginStatus"></span>
                <button type="button" class="btn small ghost" id="reloadPlugin" data-i18n-opt="reloadPlugin">重新读取插件数据</button>
            </div>
            <div id="playerSlots"></div>
        </section>

        <section>
            <h2 data-i18n-opt="secRun">运行</h2>
            <div class="grid">
                <label><span data-i18n-opt="labelZone">地区</span>
                    <select id="zoneSelect"></select>
                </label>
                <button type="button" class="btn" id="runBtn" data-i18n-opt="runBtn">模拟单个地区</button>
                <button type="button" class="btn" id="runAllBtn" data-i18n-opt="runAllBtn">模拟全部地区</button>
                <button type="button" class="btn ghost" id="stopBtn" disabled data-i18n-opt="stopBtn">停止</button>
                <span class="status" id="conditionCount"></span>
                <span class="status" id="allZonesCount"></span>
                <span class="status" id="parallelism"></span>
            </div>
            <div class="progress"><div id="progressFill"></div></div>
            <div id="progressText"></div>
        </section>

        <section>
            <h2 data-i18n-opt="secResults">结果</h2>
            <div class="grid" style="margin-bottom:10px">
                <button type="button" class="btn small ghost" id="exportBtn" data-i18n-opt="exportCsv">导出 CSV</button>
                <span class="status" id="resultsSummary"></span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr class="group">
                            <th colspan="6"></th>
                            <th class="sep" colspan="5" data-i18n-opt="thGroup">团队</th>
                            <th></th>
                        </tr>
                        <tr>
                            <th></th>
                            <th data-i18n-opt="thZone">地区</th>
                            <th data-i18n-opt="thTier">难度</th>
                            <th class="variant" data-i18n-opt="thP1">P1 方案</th>
                            <th class="variant" data-i18n-opt="thP2">P2 方案</th>
                            <th class="variant" data-i18n-opt="thP3">P3 方案</th>
                            <th class="sep" data-i18n-opt="thFragsAvg" data-i18n-opt-title="avgTitle">碎片/时</th>
                            <th data-i18n-opt="thEnc">遭遇/时</th>
                            <th data-i18n-opt="thDphAvg" data-i18n-opt-title="avgTitle">死亡/时</th>
                            <th data-i18n-opt="thXpAvg" data-i18n-opt-title="avgTitle">经验/时 (k)</th>
                            <th data-i18n-opt="thCharmAvg" data-i18n-opt-title="charmTitle">护符/时</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="previewModal" class="hidden">
        <div class="modal-card">
            <div class="modal-head">
                <h3 id="previewTitle"></h3>
                <button type="button" class="btn small ghost" id="previewClose" data-i18n-opt="close">关闭</button>
            </div>
            <div class="modal-body" id="previewBody"></div>
        </div>
    </div>

    <script src="optimization.js"></script>
</body>

</html>
